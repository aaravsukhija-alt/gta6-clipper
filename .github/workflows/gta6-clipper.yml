name: GTA 6 clipper

on:
  schedule:
    - cron: "17 */3 * * *"             # every 3 hours: find VODs, make clips (and post if it's posting time)
    - cron: "*/30 23,0,1,2,3,4 * * *"  # every 30 min, 4:30-10:30 IST: post queued clips (US evening)
  workflow_dispatch:
    inputs:
      test_streamer:
        description: "Test: make clips for ONE streamer (e.g. kaicenat) without posting; saves previews"
        required: false
        default: ""
      post_now:
        description: "Post the best queued clip right now (1 per platform), ignoring the time window"
        type: boolean
        default: false
      reset_errors:
        description: "Re-enable platforms that were stopped after an error"
        type: boolean
        default: false
      self_test:
        description: "Only run the connection self-test"
        type: boolean
        default: false
      url:
        description: "Optional: one video link to clip right now"
        required: false
        default: ""

concurrency:
  group: gta6-clipper
  cancel-in-progress: false

permissions:
  contents: write

env:
  POST_ONLY: ${{ github.event.schedule == '*/30 23,0,1,2,3,4 * * *' && '1' || '' }}

jobs:
  clip:
    runs-on: ${{ vars.CLIPPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 340
    defaults:
      run:
        # On a Windows PC "bash" can start WSL; use Git Bash (short path: GitHub can't take spaces here)
        shell: ${{ vars.CLIPPER_SHELL || (vars.CLIPPER_RUNNER == 'self-hosted' && 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}') || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2    # only needed for YouTube downloads; broken on Windows PCs
        if: runner.environment == 'github-hosted'
        with:
          deno-version: v2.x

      - name: Install ffmpeg + fonts
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed: $(command -v ffmpeg)"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            curl -fsSL --retry 3 -o ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xf ffmpeg.tar.xz
            echo "$PWD/$(ls -d ffmpeg-*-linux64-gpl)/bin" >> "$GITHUB_PATH"
          else
            echo "::error::ffmpeg is not installed on this PC. See README.md, 'Run on your own PC'."
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ] && [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo timeout 300 apt-get install -y -qq --no-install-recommends fonts-dejavu-core \
              || (sudo timeout 200 apt-get update -qq && sudo timeout 300 apt-get install -y -qq fonts-dejavu-core)
          fi

      - name: Python environment
        timeout-minutes: 30
        run: |
          PY=""
          for c in python3.12 python3.13 python3.11 python3.10 python3 python py; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              PY="$c"; break
            fi
          done
          if [ -z "$PY" ]; then echo "::error::Python 3.10+ not found. See README."; exit 1; fi
          echo "using $PY ($("$PY" --version))"
          VENV="$HOME/.gta6clipper-venv"
          [ -d "$VENV" ] || "$PY" -m venv "$VENV"
          if [ -d "$VENV/Scripts" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          "$BIN/python" -m pip install -q -U pip
          "$BIN/python" -m pip install -q -U -r requirements.txt
          if command -v cygpath >/dev/null 2>&1; then BIN="$(cygpath -w "$BIN")"; fi
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Cache Whisper models
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Offline tests
        if: env.POST_ONLY != '1'
        timeout-minutes: 15
        run: ffmpeg -version | head -1 && python -m pytest -q tests

      - name: Connection self-test
        if: inputs.self_test
        timeout-minutes: 45
        env:
          CLIPPER_YOUTUBE_OPTIONAL: ${{ runner.environment == 'github-hosted' && '1' || '' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tests/live_check.py

      - name: Find VODs, make clips, post
        id: clip
        if: ${{ !inputs.self_test }}
        env:
          EXTRA_URL: ${{ inputs.url }}
          TEST_STREAMER: ${{ inputs.test_streamer }}
          POST_NOW: ${{ inputs.post_now && '1' || '' }}
          RESET_ERRORS: ${{ inputs.reset_errors && '1' || '' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m clipper.main

      - name: Show summary
        if: always() && steps.clip.conclusion != 'skipped'
        run: |
          if [ -f output/summary.md ]; then cat output/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          rm -f output/summary.md

      - name: Upload clips
        if: always() && hashFiles('output/**/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gta6-clips-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Clean up clips on this machine
        if: always()
        run: rm -rf output

      - name: Save memory, queue, posting log and daily report
        if: always() && steps.clip.conclusion != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for p in state daily_report.md previews; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "clipper: update state and daily report [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
