# GTA 6 clipper settings. Edit right on github.com. Secrets are NEVER put here
# (they live in GitHub: Settings -> Secrets and variables -> Actions).

# Twitch VODs only (live streams are skipped until they end). All have joined Content Rewards.
streamers:
  - {platform: twitch, channel: kaicenat, name: Kai Cenat, short_name: Kai, credit: "@KaiCenat",
     hashtag: "#KaiCenat", campaign: "Kai Cenat - Content Rewards", priority: 1, permission: true}
  - {platform: twitch, channel: lacy, name: Lacy, short_name: Lacy, credit: "@LACY",
     hashtag: "#LACY", campaign: "Lacy - Content Rewards", priority: 2, permission: true}
  - {platform: twitch, channel: clix, name: Clix, short_name: Clix, credit: "@Clix",
     hashtag: "#Clix", campaign: "Clix - Content Rewards", priority: 2, permission: true}
  - {platform: twitch, channel: yourragegaming, name: YourRAGE, short_name: Rage, credit: "@YourRAGE",
     hashtag: "#YourRAGE", campaign: "YourRAGE - Content Rewards", priority: 2, permission: true}
  - {platform: twitch, channel: asianjeff, name: AsianJeff, short_name: Jeff, credit: "@AsianJeff",
     hashtag: "#AsianJeff", campaign: "AsianJeff - Content Rewards", priority: 2, permission: true}
# Optional per streamer: campaign_url: "https://whop.com/..."  (added to the phone notification)
# scan_all_videos: true  -> also use VODs whose title doesn't mention GTA 6

keywords: [gta 6, gta six, gta vi, gta6, grand theft auto 6, grand theft auto vi, grand theft auto six]
context_terms: [vice city, leonida, lucia, jason, rockstar, heist, wanted level, five star, cops, police]
hype_phrases:
  - oh my god
  - no way
  - bro what
  - this is insane
  - what the f
  - what the
  - let's go
  - insane
  - crazy
  - are you kidding
  - i can't believe

discovery:
  recent_videos_per_channel: 5
  min_date: "2026-11-18"          # never use VODs from before this day
  max_age_days: 14
  max_videos_per_run: 5

transcript:
  languages: ["en"]
  caption_wait_runs: 0
  whisper_fallback: true
  whisper_model: base
  whisper_language: null
  whisper_max_minutes: 900

moments:
  loudness_windows: 30            # loudest spots per VOD that get transcribed
  min_loudness_z: 2.0
  candidates_per_vod: 8           # best-scoring spots that get cut and face-checked
  keep_per_streamer_per_run: 2
  seconds_before_peak: 8
  target_seconds: 32
  min_seconds: 20
  max_seconds: 45
  min_score: 4
  min_english_prob: 0.7
  min_face_height: 0.10           # face must be >= 10% of the frame height ...
  min_face_ratio: 0.5             # ... in at least half of the sampled frames (streamer is the focus)
  weights: {loudness: 1.0, hype: 1.5, keyword: 1.0, reaction_tag: 2}

# kept for YouTube links / links.txt (older caption-based flow)
selection:
  clips_per_video: 3
  target_seconds: 32
  min_seconds: 20
  max_seconds: 45
  min_score: 4
  weights: {keyword: 3, context: 1, hype: 1, reaction_tag: 2, most_replayed: 6}

edit:
  vertical: true
  keep_original: false
  burn_captions: true
  headline: "GTA 6 MOMENT"
  teaser_seconds: 1.5             # hook: loudest 1.5 s shown first
  font_file: null
  width: 1080
  height: 1920

posting:
  auto: false                     # turned on after the Kai Cenat test passes (require_approval: false)
  platforms: {youtube: true, instagram: true}
  window_ist: ["05:00", "10:00"]  # India time = US evening; posts are spread over 30-minute slots
  ramp:
    week1: {youtube: 6, instagram: 8}
    week2_plus: {youtube: 6, instagram: 15}
  media_dir: "~/gta6clipper-media"   # finished clips wait here on the PC until posted
