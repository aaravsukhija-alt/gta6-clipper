# Optional per streamer (add inside the { } of that streamer):
#   campaign_url: "https://whop.com/..."   added to the phone notification
#   facecam: [x, y, w, h]                   fix the face-cam box if auto-detect is wrong. Fractions of the
#                                           stream frame, e.g. [0.70, 0.02, 0.28, 0.30] = top-right corner.
#                                           Each run's summary shows the box it detected - copy it from there.
#   layout: blur                            never use the face-cam-on-top layout for this streamer
#   live: false                             don't watch this streamer live
#   scan_all_videos: true                   also use VODs whose title doesn't mention GTA 6

keywords: [gta 6, gta six, gta vi, gta6, grand theft auto 6, grand theft auto vi, grand theft auto six]
context_terms: [vice city, leonida, lucia, jason, rockstar, heist, wanted level, five star, cops, police]
hype_phrases:
  - oh my god
  - no way
  - bro what
  - this is insane
  - what the f
  - what the
  - let's go
  - insane
  - crazy
  - are you kidding
  - i can't believe

discovery:
  recent_videos_per_channel: 5
  min_date: "2026-11-18"          # never use VODs from before this day
  max_age_days: 14
  max_videos_per_run: 5

transcript:
  languages: ["en"]
  caption_wait_runs: 0
  whisper_fallback: true
  whisper_model: base
  whisper_language: null
  whisper_max_minutes: 900

moments:
  loudness_windows: 30            # loudest spots per VOD that get transcribed
  min_loudness_z: 2.0
  candidates_per_vod: 8           # best-scoring spots that get cut and face-checked
  keep_per_streamer_per_run: 2
  seconds_before_peak: 25         # build-up before the spike
  seconds_after_peak: 5           # reaction after it
  target_seconds: 30
  min_seconds: 15                 # final clip length incl. the 1.5 s hook: 15-30 s
  max_seconds: 30
  min_score: 4
  min_english_prob: 0.7
  min_face_ratio: 0.5             # streamer's face must be visible in at least half of the frames
  weights: {loudness: 1.0, hype: 1.5, keyword: 1.0, reaction_tag: 2}

# kept for YouTube links / links.txt (older caption-based flow)
selection:
  clips_per_video: 3
  target_seconds: 32
  min_seconds: 20
  max_seconds: 45
  min_score: 4
  weights: {keyword: 3, context: 1, hype: 1, reaction_tag: 2, most_replayed: 6}

edit:
  vertical: true
  keep_original: false
  burn_captions: true
  headline: "GTA 6 MOMENT"
  teaser_seconds: 1.5             # hook: loudest 1.5 s shown first
  font_file: null
  width: 1080
  height: 1920

live:
  enabled: false                  # OFF: clips are made only after a stream ends (from the VOD)
  require_gta: true
  twitch_game_names: ["Grand Theft Auto VI"]
  poll_seconds: 120               # how often to check who is live
  quality: "720p60,720p,480p,best"
  segment_seconds: 6
  buffer_seconds: 180             # minutes of stream kept on disk: 3
  window_seconds: 30              # chat speed is measured over 30 s ...
  spike_multiplier: 3.0           # ... a spike = 3x the normal speed ...
  min_messages: 40                # ... with at least this many messages ...
  hype_share: 0.25                # ... and at least 25% hype messages
  hype_words: [kekw, lul, lmao, lmfao, lol, omegalul, w, wtf, pog, poggers, no way, clip it, clip, "😂", "💀", "😭", "🔥"]
  reaction_delay: 4               # chat reacts ~4 s after the moment
  seconds_before: 25
  seconds_after: 5
  cooldown_seconds: 300           # max one clip per 5 min per streamer
  max_clips_per_stream: 12
  post_min_score: 6               # live clips at/above this post within minutes; others wait for the window
  weights: {chat: 1.5, hype: 1.5, loudness: 1.0}

posting:
  auto: true                      # ON: Kai clips that pass the rules check post automatically (require_approval: false)
  auto_streamers: [kaicenat]      # only these are posted automatically
  share:                          # everything else (and Kai beyond the daily limits) is SENT TO YOU:
    enabled: true                 # EDITED + CLEAN .mp4 links on the "Clips to submit" issue
    max_per_day: 10               # best first
  # Music: none is ever added. Clips only contain the streamer's original audio.
  platforms: {youtube: true, instagram: true}
  window_ist: ["00:00", "23:59"]  # post as soon as clips are ready, spread over the day
  ramp:
    week1: {youtube: 6, instagram: 8}
    week2_plus: {youtube: 6, instagram: 15}
  media_dir: "~/gta6clipper-media"   # finished clips wait here on the PC until posted
